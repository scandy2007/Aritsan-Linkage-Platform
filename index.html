<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KalaSetu — Handmade by India's artisans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   KalaSetu — design tokens
   ============================================================ */
:root{
  --green:#1B4332;      /* brand, headers, artisan mode */
  --green-2:#2D6A4F;
  --green-soft:#EAF1EC;
  --marigold:#E07B2C;   /* the one action colour */
  --marigold-dk:#C4661C;
  --clay:#B4512A;
  --paper:#FBF7F0;
  --surface:#FFFFFF;
  --surface-2:#F5F0E7;
  --ink:#12160F;
  --muted:#6A7060;
  --rule:#E7DFD2;
  --ok:#2D6A4F;
  --warn:#B4512A;
  --shadow:0 1px 2px rgba(18,22,15,.06), 0 8px 24px -12px rgba(18,22,15,.18);
  --r-s:8px; --r-m:14px; --r-l:22px;
  --maxw:1240px;
  --font:'DM Sans','Noto Sans Devanagari',system-ui,-apple-system,Segoe UI,sans-serif;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14170F; --surface:#1C2018; --surface-2:#232819;
    --ink:#F2EEE4; --muted:#A8AE9C; --rule:#343A29;
    --green-soft:#22301F; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#14170F; --surface:#1C2018; --surface-2:#232819;
  --ink:#F2EEE4; --muted:#A8AE9C; --rule:#343A29;
  --green-soft:#22301F; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.2vw,44px)}
h2{font-size:clamp(21px,2.6vw,29px)}
h3{font-size:19px}
p{margin:0}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border-radius:999px;padding:11px 20px;font-weight:700;font-size:15px;
  background:var(--surface-2);color:var(--ink);border:1px solid transparent;
  transition:transform .12s ease, background .16s ease, box-shadow .16s ease;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--marigold);color:#fff;box-shadow:0 6px 16px -8px rgba(224,123,44,.9)}
.btn-pri:hover{background:var(--marigold-dk)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-2)}
.btn-ghost{background:transparent;border:1.5px solid var(--rule);color:var(--ink)}
.btn-ghost:hover{border-color:var(--green-2);color:var(--green-2)}
.btn-lg{padding:16px 28px;font-size:17px;border-radius:16px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- header ---------- */
.topbar{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:60}
.topbar-in{display:flex;align-items:center;gap:16px;padding:11px 18px;max-width:var(--maxw);margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--green);display:grid;place-items:center}
.brand-name{font-family:var(--display);font-weight:700;font-size:21px;color:var(--green);line-height:1}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1.5px solid var(--rule);border-radius:999px;padding:6px 6px 6px 16px;min-width:0}
.search:focus-within{border-color:var(--green-2);background:var(--surface)}
.search input{flex:1;background:none;border:none;outline:none;font-size:14.5px;min-width:0}
.search input::placeholder{color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);
  transition:background .15s}
.icon-btn:hover{background:var(--surface-2)}
.hdr-actions{display:flex;align-items:center;gap:4px}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--marigold);
  color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.relative{position:relative}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:var(--r-l);overflow:hidden;background:var(--green);color:#fff;
  min-height:290px;display:grid;grid-template-columns:1.1fr .9fr}
.hero-copy{padding:40px 38px;display:flex;flex-direction:column;justify-content:center;gap:14px;z-index:2}
.hero h1{color:#fff;font-size:clamp(28px,3.6vw,42px)}
.hero p{color:#CFDED4;max-width:44ch;font-size:15.5px}
.hero-art{position:relative}
.hero-dots{position:absolute;bottom:16px;right:20px;display:flex;gap:7px;z-index:3}
.hero-dots button{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45)}
.hero-dots button[aria-current="true"]{background:#fff;width:22px;border-radius:4px}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
.hero-slide.on{opacity:1}
.trust{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.trust span{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#CFDED4}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:212px 1fr;gap:26px;padding:22px 0 60px}
.rail{position:sticky;top:76px;align-self:start;background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r-m);overflow:hidden;transition:transform .28s ease}
.rail-head{display:none}
.rail h4{font-family:var(--font);font-size:13px;font-weight:700;color:var(--muted);padding:13px 16px 7px}
.rail button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 16px;font-size:14px;text-align:left;
  border-left:3px solid transparent;transition:background .15s ease}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--green-soft);border-left-color:var(--green);font-weight:700;color:var(--green)}
.rail-cta{margin:12px;padding:16px;border-radius:var(--r-m);background:var(--surface-2);border:1px dashed var(--rule)}
.drawer-btn{display:none}
.drawer-veil{display:none}
.acct-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--rule);
  border-radius:14px;box-shadow:var(--shadow);min-width:200px;padding:8px;z-index:80;display:flex;flex-direction:column;gap:2px}
.acct-role{font-size:11.5px;color:var(--muted);font-weight:700;padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.03em}
.acct-menu button{display:flex;align-items:center;gap:10px;padding:9px 10px;font-size:14px;border-radius:9px;text-align:left}
.acct-menu button:hover{background:var(--surface-2)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.section-head button{font-size:14px;font-weight:700;color:var(--green-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}

/* ---------- product card ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);overflow:hidden;
  display:flex;flex-direction:column;position:relative;transition:box-shadow .2s ease,border-color .2s ease}
.card:hover{box-shadow:var(--shadow);border-color:#D8CDB9}
.card-art{position:relative;aspect-ratio:1/1;background:var(--surface-2);overflow:hidden}
.card-art svg{width:100%;height:100%;display:block}
.tag{position:absolute;top:9px;left:9px;background:var(--green);color:#fff;font-size:11px;font-weight:700;
  padding:4px 9px;border-radius:6px;letter-spacing:.01em}
.tag.new{background:var(--clay)}
.tag.low{background:#8A6D1F}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.card-body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-title{font-size:14.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-by{font-size:12.5px;color:var(--muted)}
.card-loc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.stars{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.stars b{color:#fff;background:var(--ok);padding:1px 6px;border-radius:5px;font-size:11.5px}
.price-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-size:17px;font-weight:700;font-family:var(--font)}
.price s{font-size:12.5px;color:var(--muted);font-weight:400;margin-left:6px}
.add-btn{width:38px;height:38px;border-radius:11px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;
  transition:background .15s, transform .15s}
.add-btn:hover{background:var(--green);color:#fff}
.add-btn.done{background:var(--ok);color:#fff}

/* ---------- product detail ---------- */
.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px;padding:26px 0 60px}
.pdp-art{border:1px solid var(--rule);border-radius:var(--r-l);overflow:hidden;background:var(--surface-2);position:sticky;top:80px}
.gallery-tabs{display:flex;gap:8px;margin-bottom:10px}
.ai-badge{position:absolute;top:12px;left:12px;background:var(--green);color:#fff;font-size:11.5px;font-weight:700;
  padding:6px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.thumbs{display:flex;gap:9px;margin-top:12px}
.thumb{width:62px;height:62px;border-radius:10px;overflow:hidden;border:2px solid var(--rule);background:var(--surface-2)}
.thumb[aria-current="true"]{border-color:var(--green)}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--green-soft);color:var(--green);
  padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700}
.spec{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:14px}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-weight:500}
.maker{display:flex;gap:14px;align-items:center;border:1px solid var(--rule);border-radius:var(--r-m);padding:14px;background:var(--surface)}
.avatar{width:54px;height:54px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-family:var(--display);font-size:21px;font-weight:700;color:#fff;background:var(--green-2)}

/* ---------- generic surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:18px}
.divider{height:1px;background:var(--rule);margin:16px 0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;padding:70px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}

/* ---------- cart ---------- */
.cart-line{display:grid;grid-template-columns:92px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.cart-art{width:92px;height:92px;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--rule);border-radius:999px;overflow:hidden}
.qty button{width:34px;height:34px;display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--green)}
.qty button:hover{background:var(--surface-2)}
.qty span{min-width:30px;text-align:center;font-weight:700}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:15px;font-weight:700}
.field .hint{font-size:13.5px;color:var(--muted);font-weight:400}
.input{background:var(--surface);border:1.5px solid var(--rule);border-radius:12px;padding:13px 14px;font-size:16px;width:100%;outline:none}
.input:focus{border-color:var(--green-2)}
textarea.input{min-height:110px;resize:vertical;line-height:1.5}
.chipset{display:flex;gap:9px;flex-wrap:wrap}
.chip{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:9px 15px;font-size:14.5px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}

/* ---------- artisan mode ---------- */
.amode{background:var(--green-soft);min-height:100vh}
.abar{background:var(--green);color:#fff}
.abar-in{max-width:980px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.awrap{max-width:980px;margin:0 auto;padding:22px 18px 90px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:22px 20px;display:flex;
  flex-direction:column;gap:10px;align-items:flex-start;text-align:left;min-height:150px;justify-content:space-between;
  transition:transform .15s ease, box-shadow .2s ease}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile-ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.tile-t{font-size:19px;font-weight:700;line-height:1.25}
.tile-s{font-size:14px;color:var(--muted)}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px 18px}
.stat b{display:block;font-family:var(--display);font-size:27px;line-height:1.1}
.stat span{font-size:13.5px;color:var(--muted)}
.steps{display:flex;gap:8px;margin-bottom:22px}
.step{flex:1;height:7px;border-radius:4px;background:var(--rule)}
.step.on{background:var(--green)}
.step.cur{background:var(--marigold)}
.bigcard{background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:24px}
.photo-slot{aspect-ratio:4/3;border-radius:18px;border:2.5px dashed var(--rule);background:var(--surface-2);
  display:grid;place-items:center;overflow:hidden;position:relative}
.photo-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.photo-opt{aspect-ratio:1;border-radius:14px;overflow:hidden;border:2.5px solid var(--rule);background:var(--surface-2)}
.photo-opt[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.mic{width:66px;height:66px;border-radius:50%;background:var(--marigold);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 20px -8px rgba(224,123,44,.9);flex-shrink:0}
.mic.rec{background:var(--clay);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,81,42,.5)}70%{box-shadow:0 0 0 16px rgba(180,81,42,0)}100%{box-shadow:0 0 0 0 rgba(180,81,42,0)}}
.ai-box{background:linear-gradient(180deg,var(--green-soft),transparent);border:1px solid var(--rule);
  border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ai-label{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--green)}
.price-dial{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.price-dial input[type=range]{flex:1;min-width:180px;accent-color:var(--green)}
.sticky-foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));z-index:40}
.sticky-in{max-width:980px;margin:0 auto;display:flex;gap:12px}
.preview-frame{border:1px solid var(--rule);border-radius:18px;overflow:hidden;background:var(--surface)}
.enh-list{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.enh-list li{position:relative;padding-left:20px}
.enh-list li::before{content:'';position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:50%;background:var(--rule)}
.enh-list li.on::before{background:var(--marigold);animation:pulse 1.2s infinite}
.enh-done{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.enh-done li{display:flex;align-items:center;gap:8px}
.compare{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;border:1px solid var(--rule)}
.compare-before,.compare-after{position:absolute;inset:0}
.compare-before svg{filter:saturate(.55) brightness(.82) contrast(.92)}
.compare-after svg{filter:saturate(1.12) brightness(1.05) contrast(1.08)}
.compare input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.compare::after{content:'';position:absolute;top:0;bottom:0;left:var(--pos);width:3px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.15);pointer-events:none}
.compare-tag{position:absolute;top:10px;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:rgba(18,22,15,.65);color:#fff}
.compare-tag.left{left:10px}
.compare-tag.right{right:10px}
.preview-top{background:var(--surface-2);padding:9px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--rule)}

/* ---------- toast + misc ---------- */
.viewer3d-shell{position:relative;aspect-ratio:1/1;border-radius:var(--r-l);overflow:hidden;
  background:radial-gradient(circle at 50% 35%, #24312A, #12160F 78%);border:1px solid var(--rule)}
.viewer3d-canvas{width:100%;height:100%;cursor:grab}
.viewer3d-canvas:active{cursor:grabbing}
.viewer3d-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;
  background:rgba(20,23,15,.62);backdrop-filter:blur(6px);padding:6px;border-radius:14px}
.viewer3d-bar .icon-btn{color:#fff;width:34px;height:34px}
.viewer3d-bar .icon-btn:hover{background:rgba(255,255,255,.14)}
.viewer3d-tag{position:absolute;top:12px;left:12px;background:rgba(20,23,15,.62);color:#EFE9DC;font-size:11.5px;
  font-weight:700;padding:6px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px)}
.viewer3d-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:#CFDED4;text-align:center;padding:20px;font-size:13.5px}
.mini-spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#E07B2C;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:9px;align-items:center;width:calc(100% - 32px);max-width:430px}
.toast{background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:13px;font-size:14.5px;font-weight:500;
  box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--rule),var(--surface-2));background-size:200% 100%;
  animation:sweep 1.1s infinite;border-radius:8px;height:13px}
@keyframes sweep{to{background-position:-200% 0}}
.modal-bg{position:fixed;inset:0;background:rgba(18,22,15,.5);z-index:150;display:grid;place-items:center;padding:18px}
.modal{background:var(--surface);border-radius:22px;max-width:520px;width:100%;padding:24px;max-height:86vh;overflow:auto}
.ribbon{background:var(--surface-2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:40px}
.ribbon-in{max-width:var(--maxw);margin:0 auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}

const API_BASE = 'http://localhost:8787'; // e.g. 'https://your-deployed-backend.example.com' once you deploy kalasetu-backend

async function callApi(path, opts) {
  try {
    const res = await fetch(API_BASE + path, {
      method: opts?.method || 'GET',
      headers: { 'Content-Type': 'application/json' },
      body: opts?.body ? JSON.stringify(opts.body) : undefined,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return { ok: true, data: await res.json(), source: 'live' };
  } catch (e) {
    return { ok: false, error: e.message, source: 'mock' };
  }
}
async function callApiForm(path, formData) {

    return { ok: false, error: e.message, source: 'mock' };
  }
}

/* HD Studio Photoshoot Renderer with Guaranteed Background Removal */
async function renderStudioPhotoshoot(file, mode = 'marketplace') {
  let cutoutCanvas = null;

  // Strategy 1: AI Model Background Removal (WebAssembly)
  if (typeof imglyRemoveBackground !== 'undefined') {
    try {
      const blob = await imglyRemoveBackground(file, {
        publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.4.5/dist/'
      });
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = URL.createObjectURL(blob);
      await new Promise(r => { img.onload = r; });
      cutoutCanvas = document.createElement('canvas');
      cutoutCanvas.width = img.naturalWidth;
      cutoutCanvas.height = img.naturalHeight;
      const cctx = cutoutCanvas.getContext('2d');
      cctx.drawImage(img, 0, 0);
    } catch (err) {
      console.warn('Wasm AI cutout error, using smart saliency isolation:', err);
    }
  }

  // Strategy 2: High-accuracy Color & Edge Segmentation fallback
  if (!cutoutCanvas) {
    const rawImg = new Image();
    rawImg.crossOrigin = 'anonymous';
    rawImg.src = URL.createObjectURL(file);
    await new Promise(r => { rawImg.onload = r; });

    const w = rawImg.naturalWidth, h = rawImg.naturalHeight;
    cutoutCanvas = document.createElement('canvas');
    cutoutCanvas.width = w;
    cutoutCanvas.height = h;
    const cctx = cutoutCanvas.getContext('2d');
    cctx.drawImage(rawImg, 0, 0);

    const imgData = cctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    // Sample background dirt/ground color from corners and borders
    let bgR = 0, bgG = 0, bgB = 0, sampleCount = 0;
    const samplePx = (x, y) => {
      const idx = (y * w + x) * 4;
      bgR += data[idx]; bgG += data[idx + 1]; bgB += data[idx + 2]; sampleCount++;
    };
    for (let x = 0; x < w; x += 15) { samplePx(x, 10); samplePx(x, h - 10); }
    for (let y = 0; y < h; y += 15) { samplePx(10, y); samplePx(w - 10, y); }
    bgR /= sampleCount; bgG /= sampleCount; bgB /= sampleCount;

    const cx = w / 2, cy = h / 2;
    const maxDist = Math.hypot(w / 2, h / 2);

    // Alpha mask ground pixels outside the central subject
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const distCenter = Math.hypot(x - cx, y - cy) / maxDist;
        const colorDiff = Math.hypot(r - bgR, g - bgG, b - bgB);

        // Ground / dirt pixel detection
        if (distCenter > 0.35 && colorDiff < 48) {
          data[i + 3] = 0; // Transparent
        } else if (distCenter > 0.42 && colorDiff < 70) {
          data[i + 3] = Math.max(0, Math.min(255, (colorDiff - 48) * 11));
        }
      }
    }
    cctx.putImageData(imgData, 0, 0);
  }

  // 3. Render 1200x1200 Pure White Studio Photoshoot
  const canvas = document.createElement('canvas');
  canvas.width = 1200;
  canvas.height = 1200;
  const ctx = canvas.getContext('2d');

  const backdrops = {
    marketplace: { top: '#FFFFFF', bottom: '#FFFFFF', shadow: 'rgba(0,0,0,0.22)' }, // Pure White
    studio:      { top: '#FFFFFF', bottom: '#F2F4F7', shadow: 'rgba(0,0,0,0.26)' },
    lifestyle:   { top: '#FCFAF6', bottom: '#E5D7C4', shadow: 'rgba(0,0,0,0.35)' },
    luxury:      { top: '#2A2E33', bottom: '#141618', shadow: 'rgba(0,0,0,0.55)' },
    heritage:    { top: '#FDFBF7', bottom: '#E2CEB9', shadow: 'rgba(0,0,0,0.30)' },
  };
  const theme = backdrops[mode] || backdrops.marketplace;

  // Solid / Studio gradient background
  const grad = ctx.createLinearGradient(0, 0, 0, 1200);
  grad.addColorStop(0, theme.top);
  grad.addColorStop(1, theme.bottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1200, 1200);

  // Soft diffused base shadow
  const shadowGrad = ctx.createRadialGradient(600, 960, 20, 600, 960, 360);
  shadowGrad.addColorStop(0, theme.shadow);
  shadowGrad.addColorStop(0.5, theme.shadow.replace(/[\d.]+\)$/, '0.08)'));
  shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = shadowGrad;
  ctx.beginPath();
  ctx.ellipse(600, 960, 360, 75, 0, 0, Math.PI * 2);
  ctx.fill();

  // Draw isolated HD product
  const maxDim = 880;
  const scale = Math.min(maxDim / cutoutCanvas.width, maxDim / cutoutCanvas.height);
  const w = cutoutCanvas.width * scale;
  const h = cutoutCanvas.height * scale;
  const x = (1200 - w) / 2;
  const y = 960 - h;

  ctx.filter = 'contrast(1.10) brightness(1.05) saturate(1.10)';
  ctx.drawImage(cutoutCanvas, x, y, w, h);
  ctx.filter = 'none';

  return new Promise(resolve => {
    canvas.toBlob(blob => resolve({ blob, url: URL.createObjectURL(blob), isAiCutout: true }), 'image/jpeg', 0.95);
  });
}

  async login({ email, password }) {

  /* ---- Image enhancement: POST /api/products/:id/enhance-image (multipart) ---- */
  async enhanceImage(productId, file, mode = 'marketplace', onProgress) {
    if (!file) {
      return { source:'mock', status:'COMPLETED', demo:true,
        steps:['No photo selected — showing sample artwork.'] };
    }

    const objUrl = URL.createObjectURL(file);

    // 1. First priority: Call real backend AI pipeline
    if (API_BASE) {
      try {
        const fd = new FormData();
        fd.append('image', file, 'original.jpg');
        fd.append('mode', mode);

        onProgress && onProgress('Analyzing product & removing background…');
        const res = await fetch(API_BASE + `/api/products/${productId}/enhance-image`, { method: 'POST', body: fd });
        if (res.ok) {
          const data = await res.json();
          if (data.status === 'COMPLETED' && data.enhancedUrl) {
            return {
              ...data,
              source: 'live',
              originalUrl: data.originalUrl || objUrl,
              enhancedUrl: data.enhancedUrl,
              steps: [
                'AI foreground segmentation isolated product from mobile background',
                `Applied professional ${mode} studio backdrop & softbox lighting`,
                'Dual-layer ambient contact and directional soft shadow reconstructed',
                'Lanczos unsharp-mask sharpened craft textures and intricate motifs',
                'Color gamut & white balance calibrated while preserving authentic materials'
              ]
            };
          } else if (data.status === 'FAILED') {
            return { source: 'live', status: 'FAILED', error: data.error };
          }
        }
      } catch (err) {
        console.warn('Backend enhance call failed, falling back to local photoshoot renderer:', err);
      }
    }

    // 2. Client-side studio renderer fallback
    const photoshoot = await renderStudioPhotoshoot(file, mode);
    return {
      source: 'live',
      status: 'COMPLETED',
      originalUrl: objUrl,
      enhancedUrl: photoshoot.url,
      steps: photoshoot.isAiCutout
        ? ['Background removed & replaced with white studio cyclorama', 'Soft diffused base shadow synthesized', 'Product sharpened & contrast calibrated to HD']
        : ['Studio lighting and white balance corrected', 'Texture sharpened for HD catalog listing']
    };
  },

  /* ---- 3D generation: POST /api/products/:id/generate-3d { imageUrls, craftType } ---- */
  async generate3D(productId, imageUrls = [], craftType = 'pot') {
    if (API_BASE) {
      const r = await callApi(`/api/products/${productId}/generate-3d`, { method:'POST', body:{ imageUrls, craftType } });
      if (r.ok) return { ...r.data, source:'live' };
      return { source:'mock', status:'FAILED', error:'Could not reach the 3D backend: ' + r.error };
    }
    await wait(300);
    return { source:'mock', status:'IN_PROGRESS', demo:true };
  },
  /** Normalizes both live (PENDING/IN_PROGRESS/SUCCEEDED/FAILED) and mock
   * status vocabularies to the same {status: PROCESSING|COMPLETED|FAILED,
   * stage, progress, modelUrl, demo} shape the viewer consumes. */
  async get3DStatus(productId, demo = false) {
    if (API_BASE && !demo) {
      const r = await callApi(`/api/products/${productId}/3d-status`);
      if (r.ok) {
        const s = r.data.status;
        return { status: s === 'SUCCEEDED' ? 'COMPLETED' : s === 'FAILED' ? 'FAILED' : 'PROCESSING',
          stage: r.data.stage, progress: r.data.progress, modelUrl: r.data.modelUrls?.glb, source:'live' };
      }
      return { status:'FAILED', stage:null, error:'Lost contact with the 3D backend: ' + r.error };
    }
    await wait(1200);
    return { source:'mock', status:'COMPLETED', demo:true, assetType:'template' }; // template mesh — see buildCraftMesh
  },
  /** Polls get3DStatus until COMPLETED/FAILED, reporting stage text as it goes. */
  async poll3D(productId, { demo = false, intervalMs = 2500, maxAttempts = 40, onUpdate } = {}) {
    for (let i = 0; i < maxAttempts; i++) {
      const s = await this.get3DStatus(productId, demo);
      onUpdate && onUpdate(s);
      if (s.status === 'COMPLETED' || s.status === 'FAILED') return s;
      await wait(intervalMs);
    }
    return { status:'FAILED', stage:null, error:'Timed out waiting for the 3D model to finish.' };
  },
  async get3DModel(productId, category) {
    const r = await callApi(`/api/products/${productId}/3d-model`);
    if (r.ok) return { ...r.data, source:'live' };
    await wait(200);
    return { source:'mock', modelUrl:null, template:category || 'pot' }; // no .glb — viewer builds a template mesh
  },

  /* ---- AI structured description: POST /api/products/:id/generate-description ---- */
  async generateDescription(productId, { file, notes, category, craftType, artisanName }) {
    if (API_BASE) {
      const fd = new FormData();
      if (file) fd.append('image', file);
      if (notes) fd.append('notes', notes);
      if (category) fd.append('category', category);
      if (craftType) fd.append('craftType', craftType);
      if (artisanName) fd.append('artisanName', artisanName);

      if (r.ok) return { ...r.data, source:'live' };

    // No backend configured — build the same structured shape from the
    // lighter local AI.describe helper, but honestly marked as a demo and
    // with every non-stated attribute left uncertain rather than guessed,

/* Voice input: uses the browser's speech engine when available,
   falls back to a scripted transcript so the flow always demos. */
function useVoice(onResult) {
  const [rec, setRec] = useState(false);
  const ref = useRef(null);
  const start = useCallback((fallback) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    setRec(true);
    if (SR) {
      try {
        const r = new SR();
        r.lang = 'en-IN'; r.interimResults = false; r.maxAlternatives = 1;
        r.onresult = e => { onResult(e.results[0][0].transcript); setRec(false); };
        r.onerror = () => { setRec(false); onResult(fallback); };
        r.onend = () => setRec(false);
        ref.current = r; r.start();
        return;
      } catch (e) { /* fall through */ }
    }
    setTimeout(() => { setRec(false); onResult(fallback); }, 1900);
  }, [onResult]);
  const stop = () => { try { ref.current && ref.current.stop(); } catch(e){} setRec(false); };
  return { rec, start, stop };
}

function reducer(s, a) {
  switch (a.type) {
    case 'add': {
      const at = s.cart.find(l => l.pid === a.pid);
      return { ...s, cart: at ? s.cart.map(l => l.pid===a.pid ? {...l, qty:l.qty+(a.qty||1)} : l)
                              : [...s.cart, { pid:a.pid, qty:a.qty||1 }] };
    }
    case 'qty':    return { ...s, cart: s.cart.map(l => l.pid===a.pid ? {...l, qty:Math.max(1,l.qty+a.d)} : l) };
    case 'remove': return { ...s, cart: s.cart.filter(l => l.pid !== a.pid) };
    case 'clear':  return { ...s, cart: [] };
    case 'wish':   return { ...s, wishlist: s.wishlist.includes(a.pid) ? s.wishlist.filter(p=>p!==a.pid) : [...s.wishlist, a.pid] };
    case 'order':  return { ...s, cart: [], orders: [a.order, ...s.orders] };
    case 'publish':return { ...s, drafts: [a.product, ...s.drafts], myProducts: [a.product.id, ...s.myProducts] };
    case 'lang':   return { ...s, lang: a.lang };
    case 'login':  return { ...s, session: a.session };
    case 'logout': return { ...s, session: null };
    case 'enquiry':return { ...s, enquiries: [a.enquiry, ...s.enquiries] };
    default: return s;
  }
}

const Store = createContext(null);
const useStore = () => useContext(Store);

function StoreProvider({ children }) {
  const [state, dispatch] = useReducer(reducer, null, initial);
  const [toasts, setToasts] = useState([]);
  useEffect(() => save(state), [state]);
  const toast = useCallback((msg, icon) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, msg, icon }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  }, []);
  /* all products = catalogue + anything this artisan published */
  const catalogue = useMemo(() => [...state.drafts, ...PRODUCTS], [state.drafts]);
  const find = useCallback(id => byId(catalogue, id), [catalogue]);
  return (
    <Store.Provider value={{ state, dispatch, toast, catalogue, find, t: k => TXT[k] ? TXT[k][state.lang] || TXT[k].en : k }}>
      {children}
      <div className="toasts">{toasts.map(t => (
        <div className="toast" key={t.id}><Ic n={t.icon||'check'} s={18} c="#7FD1A0" />{t.msg}</div>
      ))}</div>
    </Store.Provider>
  );
}

function Wish({ pid }) {

}
function AddBtn({ pid, big }) {
  const { dispatch, toast } = useStore();
  const [done, setDone] = useState(false);

/* ============================================================
   3D VIEWER — real WebGL (Three.js r128), no OrbitControls dep.
   Builds a category-template mesh client-side: this is the
   "Category/template-based 3D asset" path from the spec (point
   12) — a practical stand-in for an uploaded .glb or an
   AI-generated mesh, both of which the same viewer would load
   via THREE.GLTFLoader once a real 3D-generation backend exists.
   ============================================================ */
function hexOf(cssHex) { return parseInt(cssHex.replace('#', '0x'), 16); }

function buildCraftMesh(kind) {
  const c = (PAL[kind] || PAL.pot).map(hexOf);
  const group = new THREE.Group();
  const mat = (i, rough = 0.55) => new THREE.MeshStandardMaterial({ color:c[i], roughness:rough, metalness:kind === 'lamp' || kind === 'horse' ? 0.55 : 0.05 });

  if (kind === 'vase') {
    // Tall elegant vase - flared neck, bulging body
    const vPts = [
      new THREE.Vector2(0.14, -1.1),
      new THREE.Vector2(0.28, -0.9),
      new THREE.Vector2(0.50, -0.55),
      new THREE.Vector2(0.65, -0.15),
      new THREE.Vector2(0.60, 0.25),
      new THREE.Vector2(0.38, 0.55),
      new THREE.Vector2(0.28, 0.72),
      new THREE.Vector2(0.36, 0.85),
      new THREE.Vector2(0.06, 0.85),
    ];
    const geo = new THREE.LatheGeometry(vPts, 56);
    group.add(new THREE.Mesh(geo, mat(1, 0.45)));
  } else if (kind === 'pot') {
    // ─── TERRACOTTA MATKA — full realistic pot with hollow interior + carved geometric patterns ───
    // Materials
    const clayColor = 0xC4956A;         // warm terracotta
    const clayDark  = 0xA0704A;         // inside darker clay
    const patternCol= 0x1E0E04;         // near-black carved motif lines (like the reference)
    const rimCol    = 0xD4A878;         // slightly lighter flared rim

    const clayMat  = new THREE.MeshStandardMaterial({ color:clayColor, roughness:0.72, metalness:0.02 });
    const innerMat = new THREE.MeshStandardMaterial({ color:clayDark,  roughness:0.82, metalness:0.01, side:THREE.BackSide });
    const patMat   = new THREE.MeshStandardMaterial({ color:patternCol,roughness:0.88, metalness:0.0  });
    const rimMat   = new THREE.MeshStandardMaterial({ color:rimCol,    roughness:0.65, metalness:0.03 });

    // ── OUTER SHELL (82 lathe segments = very smooth) ──
    const outerPts = [
      new THREE.Vector2(0.07, -0.88),
      new THREE.Vector2(0.30, -0.87),
      new THREE.Vector2(0.52, -0.84),
      new THREE.Vector2(0.68, -0.76),
      new THREE.Vector2(0.82, -0.62),
      new THREE.Vector2(0.93, -0.42),
      new THREE.Vector2(1.00, -0.18),
      new THREE.Vector2(1.02, 0.00),
      new THREE.Vector2(0.99, 0.14),
      new THREE.Vector2(0.90, 0.28),
      new THREE.Vector2(0.78, 0.38),
      new THREE.Vector2(0.62, 0.46),
      new THREE.Vector2(0.50, 0.50),   // throat
      new THREE.Vector2(0.56, 0.57),
      new THREE.Vector2(0.68, 0.63),
      new THREE.Vector2(0.82, 0.70),
      new THREE.Vector2(0.92, 0.76),   // rim shelf
      new THREE.Vector2(0.95, 0.80),
      new THREE.Vector2(0.93, 0.84),
      new THREE.Vector2(0.86, 0.87),
      new THREE.Vector2(0.54, 0.88),   // inner rim surface
      new THREE.Vector2(0.06, 0.88),   // opening center
    ];
    group.add(new THREE.Mesh(new THREE.LatheGeometry(outerPts, 80), clayMat));

    // ── INNER SHELL (visible when looking from above into the pot) ──
    const innerPts = [
      new THREE.Vector2(0.05, 0.87),
      new THREE.Vector2(0.50, 0.87),
      new THREE.Vector2(0.58, 0.83),
      new THREE.Vector2(0.50, 0.74),   // inner neck flare underside
      new THREE.Vector2(0.42, 0.62),
      new THREE.Vector2(0.36, 0.52),
      new THREE.Vector2(0.42, 0.40),
      new THREE.Vector2(0.60, 0.28),
      new THREE.Vector2(0.78, 0.10),
      new THREE.Vector2(0.88, -0.10),
      new THREE.Vector2(0.86, -0.36),
      new THREE.Vector2(0.75, -0.58),
      new THREE.Vector2(0.52, -0.76),
      new THREE.Vector2(0.28, -0.84),
      new THREE.Vector2(0.06, -0.86),
    ];
    group.add(new THREE.Mesh(new THREE.LatheGeometry(innerPts, 72), innerMat));

    // ── FLAT BOTTOM CAP ──
    const botGeo = new THREE.CircleGeometry(0.07, 32);
    const bot    = new THREE.Mesh(botGeo, new THREE.MeshStandardMaterial({ color:0x8B5A3A, roughness:0.95 }));
    bot.rotation.x = -Math.PI / 2; bot.position.y = -0.875; group.add(bot);

    // ── RIM TORUS (rounded lip, slightly lighter color) ──
    const rimTorus = new THREE.Mesh(new THREE.TorusGeometry(0.90, 0.032, 14, 80), rimMat);
    rimTorus.position.y = 0.78; group.add(rimTorus);

    // ── CARVED BANDS (four raised dark rings at key body positions) ──
    const bands = [
      { r:0.500, y:0.500, t:0.022 },  // throat band
      { r:0.740, y:0.380, t:0.020 },  // upper-neck band
      { r:1.005, y:-0.005, t:0.024 }, // shoulder / max-width band
      { r:0.940, y:-0.430, t:0.020 }, // lower-body band
      { r:0.680, y:-0.760, t:0.018 }, // near-base band
    ];
    bands.forEach(({ r, y, t }) => {
      const b = new THREE.Mesh(new THREE.TorusGeometry(r, t, 10, 80), patMat);
      b.position.y = y; group.add(b);
    });

    // ── GEOMETRIC TRIANGLE CHEVRONS around the wide body ──
    // (mimics the angular tribal pattern on the reference pot)
    const N = 14;
    for (let i = 0; i < N; i++) {
      const ang = (i / N) * Math.PI * 2;
      const sin = Math.sin(ang), cos = Math.cos(ang);

      // UP-pointing solid triangle (cone)
      const upR = 0.97;
      const up = new THREE.Mesh(
        new THREE.ConeGeometry(0.055, 0.16, 4, 1),
        patMat
      );
      up.position.set(sin * upR, -0.25, cos * upR);
      up.rotation.y = -ang + Math.PI / 4; // rotate cone square-face forward
      group.add(up);

      // DOWN-pointing inverted triangle between each up
      const downAng = ang + (Math.PI / N);
      const ds = Math.sin(downAng), dc = Math.cos(downAng);
      const downR = 0.92;
      const down = new THREE.Mesh(
        new THREE.ConeGeometry(0.045, 0.13, 4, 1),
        patMat
      );
      down.position.set(ds * downR, -0.50, dc * downR);
      down.rotation.y  = -downAng + Math.PI / 4;
      down.rotation.z  = Math.PI; // flip to point downward
      group.add(down);
    }

    // ── SCROLL / WAVE ARC MOTIFS at shoulder band ──
    // (mimics the curling-wave scroll lines on the reference pot)
    const NS = 10;
    for (let i = 0; i < NS; i++) {
      const ang = (i / NS) * Math.PI * 2;
      const sin = Math.sin(ang), cos = Math.cos(ang);
      const scrollR = 0.98;

      // Inner arc stroke
      const arc = new THREE.Mesh(
        new THREE.TorusGeometry(0.052, 0.014, 6, 18, Math.PI * 1.35),
        patMat
      );
      arc.position.set(sin * scrollR, 0.09, cos * scrollR);
      arc.rotation.y = -ang;
      group.add(arc);

      // Small dot accent next to each scroll
      const dot = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 8), patMat);
      dot.position.set(sin * (scrollR - 0.02), 0.18, cos * (scrollR - 0.02));
      group.add(dot);
    }

    // ── INNER RIM CARVED GROOVE (visible when looking in from top) ──
    const innerRimGroove = new THREE.Mesh(
      new THREE.TorusGeometry(0.50, 0.016, 8, 64),
      patMat
    );
    innerRimGroove.position.y = 0.80; group.add(innerRimGroove);

    // ── HATCHED LINES on lower body band ──
    const NH = 18;
    for (let i = 0; i < NH; i++) {
      const ang = (i / NH) * Math.PI * 2;
      const sin = Math.sin(ang), cos = Math.cos(ang);
      const ht = 0.88;
      const stroke = new THREE.Mesh(
        new THREE.CylinderGeometry(0.010, 0.010, 0.14, 5),
        patMat
      );
      stroke.position.set(sin * ht, -0.72, cos * ht);
      stroke.rotation.y = -ang;
      stroke.rotation.z = Math.PI * 0.18; // slight diagonal
      group.add(stroke);
    }
  } else if (kind === 'basket' || kind === 'coaster') {
    const geo = new THREE.CylinderGeometry(1, 0.85, kind === 'coaster' ? 0.18 : 0.9, 24, 1, true);
    const m = new THREE.Mesh(geo, mat(1, 0.9)); group.add(m);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(1, 0.06, 10, 30), mat(2, 0.7));
    rim.rotation.x = Math.PI / 2; rim.position.y = kind === 'coaster' ? 0.09 : 0.45; group.add(rim);
  } else if (kind === 'bag' || kind === 'cushion' || kind === 'runner' || kind === 'dupatta') {
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, kind === 'bag' ? 1.5 : 0.18, 0.35), mat(1, 0.85));
    group.add(body);
    if (kind === 'bag') {
      const h1 = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.05, 8, 20, Math.PI), mat(3, 0.5));
      h1.position.set(-0.4, 0.95, 0); h1.rotation.z = Math.PI; group.add(h1);
      const h2 = h1.clone(); h2.position.x = 0.4; group.add(h2);
    }
  } else if (kind === 'elephant' || kind === 'horse') {
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.85, 24, 20), mat(1, 0.6));
    body.scale.set(1.15, 0.9, 0.8); group.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 16), mat(1, 0.6));
    head.position.set(0.95, 0.3, 0); group.add(head);
    [[-0.55,-0.75,0.35],[0.15,-0.75,0.35],[-0.55,-0.75,-0.35],[0.15,-0.75,-0.35]].forEach(p => {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.75, 10), mat(2, 0.7));
      leg.position.set(p[0], p[1], p[2]); group.add(leg);
    });
  } else if (kind === 'earrings') {
    [-0.5, 0.5].forEach(x => {
      const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.42, 0), mat(1, 0.3));
      gem.position.set(x, 0, 0); group.add(gem);
      const hook = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.03, 8, 16, Math.PI * 1.4), mat(3, 0.4));
      hook.position.set(x, 0.5, 0); group.add(hook);
    });
  } else if (kind === 'lamp') {
    [-0.5, 0.5].forEach(x => {
      const base = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.35, 24, 1, true), mat(1, 0.35));
      base.position.set(x, -0.1, 0); group.add(base);
      const flame = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.32, 12), new THREE.MeshStandardMaterial({ color:0xF6C453, emissive:0xB4791B, emissiveIntensity:0.6 }));
      flame.position.set(x, 0.26, 0); group.add(flame);
    });
  } else if (kind === 'painting') {
    const frame = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.2, 0.08), mat(3, 0.7));
    group.add(frame);
    const canvas = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.0), mat(1, 0.95));
    canvas.position.z = 0.045; group.add(canvas);
  } else {
    group.add(new THREE.Mesh(new THREE.DodecahedronGeometry(0.9, 0), mat(1, 0.5)));
  }
  const box = new THREE.Box3().setFromObject(group);
  const size = new THREE.Vector3(); box.getSize(size);
  const scale = 1.9 / Math.max(size.x, size.y, size.z, 0.001);
  group.scale.setScalar(scale);
  const center = new THREE.Vector3(); box.getCenter(center);
  group.position.sub(center.multiplyScalar(scale));
  return group;
}

function Viewer3D({ art, status, modelUrl, stage }) {
  const mountRef = useRef(null);
  const stateRef = useRef({});
  const wrapRef = useRef(null);
  const [full, setFull] = useState(false);
  const [noWebgl, setNoWebgl] = useState(false);
  const [loadErr, setLoadErr] = useState(false);

  useEffect(() => {
    if (status !== 'COMPLETED' || !mountRef.current) return;
    if (typeof THREE === 'undefined') { setNoWebgl(true); return; }
    const el = mountRef.current;
    const w = el.clientWidth, h = el.clientHeight;
    let scene;
    try {
      scene = new THREE.Scene();
    } catch (e) { setNoWebgl(true); return; }
    const camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
    let radius = 4.2, theta = 0.5, phi = 0.95; // 3/4 top view — reveals rim + wide body
    const setCam = () => {
      camera.position.set(radius * Math.sin(phi) * Math.sin(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.cos(theta));
      camera.lookAt(0, 0, 0);
    };
    setCam();
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    } catch (e) { setNoWebgl(true); return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h);
    el.innerHTML = ''; el.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xFFF5E8, 0x2a1a0a, 0.85)); // warm sky / warm ground
    const key = new THREE.DirectionalLight(0xFFEDD0, 1.2); key.position.set(3, 5, 4); scene.add(key); // warm key light
    const fill = new THREE.DirectionalLight(0xFFF0E0, 0.55); fill.position.set(-3, 2, 2); scene.add(fill); // soft fill
    const rim = new THREE.DirectionalLight(0xC4661C, 0.45); rim.position.set(-2, -1, -4); scene.add(rim); // deep amber rim

    let mesh = null;
    const fitAndAdd = obj => {
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3(); box.getSize(size);
      const scale = 1.9 / Math.max(size.x, size.y, size.z, 0.001);
      obj.scale.setScalar(scale);
      const center = new THREE.Vector3(); box.getCenter(center);
      obj.position.sub(center.multiplyScalar(scale));
      scene.add(obj);
      mesh = obj;
    };

    const canLoadReal = Boolean(modelUrl && typeof THREE.GLTFLoader !== 'undefined');
    if (canLoadReal) {
      new THREE.GLTFLoader().load(modelUrl, gltf => fitAndAdd(gltf.scene),
        undefined,
        () => { setLoadErr(true); fitAndAdd(buildCraftMesh(art)); }); // real model failed — fall back, never break
    } else {
      if (modelUrl) setLoadErr(true); // had a real URL but no loader available — still fall back
      fitAndAdd(buildCraftMesh(art));
    }

    const pad = new THREE.Mesh(new THREE.CircleGeometry(1.5, 40), new THREE.MeshStandardMaterial({ color:0x1B4332, roughness:1 }));
    pad.rotation.x = -Math.PI / 2; pad.position.y = -0.95; pad.receiveShadow = false; scene.add(pad);

    let raf;
    const loop = () => { raf = requestAnimationFrame(loop); if (mesh) mesh.rotation.y += stateRef.current.spin ? 0.004 : 0; renderer.render(scene, camera); };
    loop();

    const drag = { on:false, x:0, y:0 };
    const onDown = e => { drag.on = true; drag.x = e.clientX; drag.y = e.clientY; stateRef.current.spin = false; };
    const onMove = e => {
      if (!drag.on) return;
      theta -= (e.clientX - drag.x) * 0.008; phi = Math.min(2.6, Math.max(0.5, phi - (e.clientY - drag.y) * 0.008));
      drag.x = e.clientX; drag.y = e.clientY; setCam();
    };
    const onUp = () => { drag.on = false; };
    const onWheel = e => { e.preventDefault(); radius = Math.min(9, Math.max(2.4, radius + e.deltaY * 0.0035)); setCam(); };
    renderer.domElement.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    renderer.domElement.addEventListener('wheel', onWheel, { passive:false });

    const onResize = () => { const w2 = el.clientWidth, h2 = el.clientHeight; camera.aspect = w2 / h2; camera.updateProjectionMatrix(); renderer.setSize(w2, h2); };
    window.addEventListener('resize', onResize);

    stateRef.current = { spin:true, zoomIn:() => { radius = Math.max(2.4, radius - 0.6); setCam(); },
      zoomOut:() => { radius = Math.min(9, radius + 0.6); setCam(); },
      reset:() => { radius = 4.2; theta = 0.5; phi = 0.95; setCam(); stateRef.current.spin = true; } };

    return () => {
      cancelAnimationFrame(raf);
      renderer.domElement.removeEventListener('pointerdown', onDown);
      renderer.domElement.removeEventListener('wheel', onWheel);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('resize', onResize);
      renderer.dispose(); el.innerHTML = '';
    };
  }, [art, status, modelUrl]);

  const toggleFull = () => {
    const el = wrapRef.current; if (!el) return;
    if (!document.fullscreenElement) { el.requestFullscreen?.(); setFull(true); }
    else { document.exitFullscreen?.(); setFull(false); }
  };

  if (status === 'FAILED') return (
    <div className="viewer3d-shell"><div className="viewer3d-msg">
      <Ic n="cube" s={30} c="#B4512A" /><p>The 3D model could not be generated.<br/>You can try again, or keep selling with photos only.</p>
    </div></div>
  );
  if (status !== 'COMPLETED') return (
    <div className="viewer3d-shell"><div className="viewer3d-msg">
      <div className="mini-spin" /><p>{stage || 'Building the 3D preview…'}</p>
    </div></div>
  );
  if (noWebgl) return (
    <div className="viewer3d-shell"><div className="viewer3d-msg">
      <Ic n="cube" s={30} c="#CFDED4" /><p>3D preview isn’t available in this browser window.<br/>The photo gallery still shows this product in full detail.</p>
    </div></div>
  );
  return (
    <div className="viewer3d-shell" ref={wrapRef}>
      <div className="viewer3d-canvas" ref={mountRef} />
      <div className="viewer3d-bar">
        <button className="icon-btn" onClick={() => stateRef.current.zoomIn?.()} aria-label="Zoom in"><Ic n="zoomin" s={18} /></button>
        <button className="icon-btn" onClick={() => stateRef.current.zoomOut?.()} aria-label="Zoom out"><Ic n="zoomout" s={18} /></button>
        <button className="icon-btn" onClick={() => stateRef.current.reset?.()} aria-label="Reset view"><Ic n="rotate" s={18} /></button>
        <button className="icon-btn" onClick={toggleFull} aria-label="Fullscreen"><Ic n="expand" s={18} /></button>
      </div>
      <span className="viewer3d-tag"><Ic n="cube" s={13} /> {modelUrl && !loadErr ? 'AI-generated 3D preview' : 'Template 3D preview'} · drag to rotate</span>
    </div>
  );
}

/* ---------------- horizontal carousel: drag, touch, arrows, snap ---------------- */
function Carousel({ children }) {
  const trackRef = useRef(null);
  const [atStart, setAtStart] = useState(true);
  const [atEnd, setAtEnd] = useState(false);
  const drag = useRef({ down:false, x:0, left:0, moved:false });

  const measure = useCallback(() => {
    const el = trackRef.current; if (!el) return;
    setAtStart(el.scrollLeft <= 4);
    setAtEnd(el.scrollLeft + el.clientWidth >= el.scrollWidth - 4);
  }, []);
  useEffect(() => { measure(); const el = trackRef.current; if (!el) return;
    el.addEventListener('scroll', measure, { passive:true });
    window.addEventListener('resize', measure);
    return () => { el.removeEventListener('scroll', measure); window.removeEventListener('resize', measure); };
  }, [measure]);

  const byPage = dir => {
    const el = trackRef.current; if (!el) return;
    el.scrollBy({ left: dir * el.clientWidth * 0.86, behavior:'smooth' });
  };
  const onDown = e => {
    const el = trackRef.current;
    drag.current = { down:true, x:e.clientX ?? e.touches?.[0]?.clientX, left:el.scrollLeft, moved:false };
    el.style.scrollSnapType = 'none';
  };
  const onMove = e => {
    if (!drag.current.down) return;
    const x = e.clientX ?? e.touches?.[0]?.clientX;
    const dx = x - drag.current.x;
    if (Math.abs(dx) > 4) drag.current.moved = true;
    trackRef.current.scrollLeft = drag.current.left - dx;
  };
  const onUp = () => { drag.current.down = false; if (trackRef.current) trackRef.current.style.scrollSnapType = 'x mandatory'; };

  return (
    <div className="carousel">
      <div className="carousel-track" ref={trackRef}
        onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
        onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}
        onClickCapture={e => { if (drag.current.moved) { e.preventDefault(); e.stopPropagation(); drag.current.moved = false; } }}>
        {children}
      </div>
      <button className="car-arrow left" aria-label="Scroll left" onClick={() => byPage(-1)} disabled={atStart}><Ic n="back" s={20} /></button>
      <button className="car-arrow right" aria-label="Scroll right" onClick={() => byPage(1)} disabled={atEnd}><Ic n="arrow" s={20} /></button>
    </div>
  );
}

function Listing({ go, nav }) {
  const { catalogue } = useStore();
  const [sort, setSort] = useState('pop');
  const [band, setBand] = useState('any');
  const cat = nav.cat || 'all';
  const q = (nav.q || '').trim().toLowerCase();
  let list = catalogue.filter(p => cat === 'all' || p.cat === cat);
  if (q) list = list.filter(p => (p.name + ' ' + p.material + ' ' + (maker(p)?.name || '') + ' ' + (maker(p)?.craft || '')).toLowerCase().includes(q));
  if (band !== 'any') {
    const [lo, hi] = band.split('-').map(Number);
    list = list.filter(p => p.price >= lo && p.price <= hi);

  list = [...list].sort((a, b) => sort === 'low' ? a.price - b.price : sort === 'high' ? b.price - a.price : b.rating - a.rating);
  const label = CATEGORIES.find(c => c.id === cat)?.label || 'All crafts';

    try {
      const craftType = p.cat || p.art || 'pot';
      const imgUrls = p.enhancedPhotoUrl ? [p.enhancedPhotoUrl] : [];
      await Api.generate3D(p.id, imgUrls, craftType);
      const final = await Api.poll3D(p.id, { demo: false, onUpdate: s => setD3Stage(s.stage || '') });

              </div>
              <div className="thumbs">
                {[0,1,2].map(i => (
                  <button key={i} className="thumb" aria-current={view === i} onClick={() => setView(i)} aria-label={i === 0 ? 'Photo' : `View ${i+1}`}>
                    <CraftArt kind={p.art} variant={p.id + i} />

              </div>
              <p className="muted" style={{ fontSize:12.5, marginTop:8 }}>
                {p.aiEnhanced ? 'Retouched using KalaSetu\u2019s AI Studio Photography Pipeline. Original artisan capture is safely preserved.'
                  : 'Authentic handmade product listing with verified artisan craft attribution.'}
              </p>
            </>
          )}
          {mode === 'compare' && (
            <>
              <div className="compare" style={{ '--pos': comparePos + '%' }}>
                <div className="compare-before">
                  {p.originalPhotoUrl
                    ? <img src={p.originalPhotoUrl} alt="Original" style={{ width:'100%', height:'100%', objectFit:'cover' }} />
                    : <CraftArt kind={p.art} variant={p.id + 'orig'} />}
                </div>
                <div className="compare-after" style={{ clipPath:`inset(0 0 0 ${comparePos}%)` }}>
                  {p.enhancedPhotoUrl

          {mode === '3d' && (
            <>

              <div className="row" style={{ marginTop:10, gap:8 }}>

            <h1 style={{ margin:'10px 0 6px' }}>{p.name}</h1>

            <p className="muted" style={{ fontSize:13.5, marginTop:4 }}>Inclusive of taxes. Free delivery above ₹999.</p>

function BulkQuoteModal({ p, a, onClose }) {
  const { toast, dispatch } = useStore();
  const [f, setF] = useState({ qty:'50', date:'', location:'', message:'' });
  const [busy, setBusy] = useState(false); const [done, setDone] = useState(null);
  const set = (k, v) => setF(s => ({ ...s, [k]: v }));
  const submit = async e => {
    e.preventDefault(); setBusy(true);
    const res = await Api.submitEnquiry({ productId:p.id, artisanId:a.id, ...f });
    dispatch({ type:'enquiry', enquiry:{ id:res.id, product:p.name, ...f, date:new Date().toISOString().slice(0,10) } });
    setBusy(false); setDone(res.id); toast('Enquiry sent to ' + a.name, 'box');
  };
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="between" style={{ marginBottom:10 }}>
          <h2>Request a bulk quote</h2>
          <button className="icon-btn" onClick={onClose} aria-label="Close"><Ic n="x" s={20} /></button>
        </div>
        {done ? (
          <div className="empty" style={{ padding:'20px 0' }}>
            <Ic n="check" s={34} c="#2D6A4F" />
            <h3>Enquiry {done} sent</h3>
            <p className="muted">{a.name} will reply with pricing and lead time for {p.name}.</p>
            <button className="btn btn-green" onClick={onClose}>Done</button>
          </div>
        ) : (
          <form className="stack" onSubmit={submit}>
            <p className="muted" style={{ fontSize:13.5 }}>For {p.name}, made by {a.name}.</p>
            <div className="field"><label htmlFor="bq-q">Quantity needed</label><input id="bq-q" className="input" value={f.qty} onChange={e => set('qty', e.target.value.replace(/\D/g,''))} /></div>
            <div className="field"><label htmlFor="bq-d">Required by</label><input id="bq-d" type="date" className="input" value={f.date} onChange={e => set('date', e.target.value)} /></div>
            <div className="field"><label htmlFor="bq-l">Delivery location</label><input id="bq-l" className="input" placeholder="City, state" value={f.location} onChange={e => set('location', e.target.value)} /></div>
            <div className="field"><label htmlFor="bq-m">Message (optional)</label><textarea id="bq-m" className="input" value={f.message} onChange={e => set('message', e.target.value)} /></div>
            <button className="btn btn-pri btn-lg btn-block" disabled={busy}>{busy ? 'Sending…' : 'Submit enquiry'}</button>
          </form>
        )}
      </div>
    </div>
  );
}

function Checkout({ go }) {

  const sub = lines.reduce((n, l) => n + l.p.price * l.qty, 0);

        <div className="panel stack">

      </div>
    </div>
  );
