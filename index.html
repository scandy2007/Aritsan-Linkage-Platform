function VoiceField({ label, hint, value, onChange, placeholder, sample, multiline }) {
  const { rec, start } = useVoice(txt => onChange(value ? value + ' ' + txt : txt));
  const Tag = multiline ? 'textarea' : 'input';
  return (
    <div className="field">
      <label>{label}{hint && <span className="hint" style={{ display:'block' }}>{hint}</span>}</label>
      <div className="row" style={{ alignItems:'flex-start' }}>
        <Tag className="input" style={{ flex:1, fontSize:17 }} value={value} placeholder={placeholder}
          onChange={e => onChange(e.target.value)} />
        <button className={'mic' + (rec ? ' rec' : '')} onClick={() => start(sample)} aria-label={rec ? 'Listening' : 'Speak instead of typing'}>
          <Ic n="mic" s={28} c="#fff" />
        </button>
      </div>
      <span className="hint">{rec ? 'Listening… speak now' : 'Tap the orange button and speak'}</span>
    </div>
  );
}

const ART_CHOICES = ['bag','pot','stole','elephant','earrings','basket','lamp','cushion'];

/* ---------------- AI catalog panel: structured, editable, source-tagged ---------------- */
function CatalogPanel({ f, set, me, draftId }) {
  const { toast } = useStore();
  const [cat, setCatState] = useState({ status:'IDLE', data:null, lang:'en', source:'', error:'' });

  const generate = async (e) => {
    e && e.preventDefault();
    setCatState(c => ({ ...c, status:'LOADING' }));
    try {
      const res = await Api.generateDescription(draftId, {
        file: f.photoFile, notes: f.notes, category: f.cat, craftType: me.craft, artisanName: me.name,
      });
      if (res.status === 'FAILED') { setCatState(c => ({ ...c, status:'FAILED', error: res.error })); return; }
      setCatState({ status:'COMPLETED', data: res, lang:'en', source: res.source || 'live', error:'' });
      toast('Product description drafted with key features and care instructions', 'sparkle');
    } catch (err) {
      setCatState(c => ({ ...c, status:'FAILED', error: err.message }));
    }
  };

  const setAttr = (key, val) => setCatState(c => ({ ...c, data: { ...c.data, attributes: { ...c.data.attributes, [key]: { ...(c.data.attributes?.[key] || {}), value: val, source:'stated' } } } }));
  const setDesc = (field, val) => setCatState(c => ({ ...c, data: { ...c.data, descriptions: { ...c.data.descriptions, [field]: val } } }));
  const setName = val => setCatState(c => ({ ...c, data: { ...c.data, productName: val } }));
  const setCare = val => setCatState(c => ({ ...c, data: { ...c.data, careInstructions: val } }));

  const apply = (e) => {
    e && e.preventDefault();
    const d = cat.data;
    if (d.productName) set('name', d.productName);
    if (d.attributes?.material?.value) set('material', d.attributes.material.value);
    const desc = cat.lang === 'hi' ? d.descriptions?.detailedHi : d.descriptions?.detailedEn;
    if (desc) set('desc', desc);
    toast('Applied details and bulleted description to your listing', 'check');
  };

  const SOURCE_LABEL = { stated:'You said this', observed:'Seen in photo', uncertain:'Please confirm' };
  const SOURCE_ICON = { stated:'check', observed:'eye', uncertain:'bulb' };
  const SOURCE_COLOR = { stated:'var(--ok)', observed:'var(--green-2)', uncertain:'var(--clay)' };

  return (
    <div className="ai-box" style={{ gap:16 }}>
      <div className="between">
        <span className="ai-label"><Ic n="sparkle" s={15} /> AI Product Listing Assistant</span>
        {cat.status === 'COMPLETED' && <span className="pill" style={{ fontSize:11.5 }}><Ic n="check" s={12} /> Ready</span>}
      </div>
      {cat.status === 'IDLE' && (
        <>
          <p style={{ fontSize:14.5, lineHeight:1.55 }}>
            We'll transform your photo and craft notes into a professional e-commerce product listing — generating structured attributes, bullet-pointed key features, care instructions, and detailed descriptions in English and Hindi.
          </p>
          <button type="button" className="btn btn-green" onClick={generate} disabled={!f.name.trim()}>
            <Ic n="sparkle" s={16} c="#fff" /> Generate structured description
          </button>
        </>
      )}
      {cat.status === 'LOADING' && (
        <div className="stack" style={{ gap:8 }}>
          <div className="row" style={{ gap:10 }}>
            <div className="mini-spin" style={{ width:20, height:20, borderWidth:2 }} />
            <span style={{ fontSize:14, fontWeight:600 }}>Analyzing product details, writing key features and translation…</span>
          </div>
          <div className="skel" style={{ width:'92%' }} /><div className="skel" style={{ width:'78%' }} /><div className="skel" style={{ width:'86%' }} />
        </div>
      )}
      {cat.status === 'FAILED' && (
        <>
          <p className="muted" style={{ fontSize:14 }}>{cat.error || 'Could not generate a listing right now.'}</p>
          <button type="button" className="btn btn-ghost" onClick={generate}>Try again</button>
        </>
      )}
      {cat.status === 'COMPLETED' && cat.data && (
        <>
          {cat.data.warnings?.length > 0 && (
            <div className="panel" style={{ background:'#FBEEDF', borderColor:'#E8CDA6', padding:12 }}>
              <span style={{ color:'var(--clay)', fontWeight:700, fontSize:13 }}>Please check these</span>
              <ul style={{ margin:'6px 0 0', paddingLeft:18, fontSize:13 }}>{cat.data.warnings.map((w,i) => <li key={i}>{w}</li>)}</ul>
            </div>
          )}
          <div className="field">
            <label>Suggested product title</label>
            <input className="input" value={cat.data.productName || ''} onChange={e => setName(e.target.value)} />
          </div>
          <div className="stack" style={{ gap:10 }}>
            {['material','colour','pattern','dimensions','origin'].map(k => {
              const a = cat.data.attributes?.[k] || { value:null, source:'uncertain' };
              return (
                <div className="field" key={k}>
                  <label style={{ display:'flex', alignItems:'center', gap:8, textTransform:'capitalize' }}>
                    {k}
                    <span style={{ fontSize:11.5, fontWeight:700, color:SOURCE_COLOR[a.source] || SOURCE_COLOR.uncertain, display:'inline-flex', alignItems:'center', gap:4 }}>
                      <Ic n={SOURCE_ICON[a.source] || 'bulb'} s={12} /> {SOURCE_LABEL[a.source] || SOURCE_LABEL.uncertain}
                    </span>
                  </label>
                  <input className="input" value={a.value || ''} placeholder={a.source === 'uncertain' ? 'Not mentioned — add it yourself' : ''}
                    onChange={e => setAttr(k, e.target.value)} />
                </div>
              );
            })}
          </div>
          {cat.data.keyFeatures?.length > 0 && (
            <div className="field">
              <label>Key features &amp; craftsmanship points</label>
              <div className="panel" style={{ background:'var(--surface-2)', padding:'12px 16px' }}>
                <ul style={{ margin:0, paddingLeft:18, display:'flex', flexDirection:'column', gap:6, fontSize:13.5 }}>
                  {cat.data.keyFeatures.map((kf, i) => (
                    <li key={i}><b>{kf}</b></li>
                  ))}
                </ul>
              </div>
            </div>
          )}
          {cat.data.careInstructions && (
            <div className="field">
              <label>Care &amp; maintenance instructions</label>
              <input className="input" value={cat.data.careInstructions || ''} onChange={e => setCare(e.target.value)} />
            </div>
          )}
          <div className="field">
            <label>Product story &amp; description</label>
            <div className="chipset" style={{ marginBottom:6 }}>
              <button type="button" className="chip" aria-pressed={cat.lang === 'en'} onClick={() => setCatState(c => ({ ...c, lang:'en' }))}>English</button>
              <button type="button" className="chip" aria-pressed={cat.lang === 'hi'} onClick={() => setCatState(c => ({ ...c, lang:'hi' }))}>हिन्दी</button>
            </div>
            <textarea className="input" style={{ minHeight:120, whiteSpace:'pre-line', lineHeight:1.6 }}
              value={(cat.lang === 'hi' ? cat.data.descriptions?.detailedHi : cat.data.descriptions?.detailedEn) || ''}
              onChange={e => setDesc(cat.lang === 'hi' ? 'detailedHi' : 'detailedEn', e.target.value)} />
          </div>
          <div className="row" style={{ gap:10 }}>
            <button type="button" className="btn btn-green" onClick={apply}><Ic n="check" s={16} c="#fff" /> Apply to listing</button>
            <button type="button" className="btn btn-ghost" onClick={generate}>Regenerate</button>
          </div>
        </>
      )}
    </div>
  );
}

function AddProduct({ back, onDone }) {
  const { state, dispatch, toast, t } = useStore();
  const me = byId(ARTISANS, state.user.artisanId);
  const draftId = useRef('draft-' + Date.now()).current;
  const [step, setStep] = useState(0);
  const [f, setF] = useState({
    art:'', name:'', notes:'', material:'', cat:'pottery', price:'', stock:'5', desc:'', hours:'6', cost:'150',
    photoFile:null, photoPreview:'', extraPhotos:[]
  });
  const [ai, setAi] = useState({ desc:false, price:null, priceLoading:false });
  const [mode, setMode] = useState('studio'); // studio | lifestyle | luxury | heritage | marketplace
  const [enhance, setEnhance] = useState({ status:'IDLE', steps:[], compare:50, source:'' }); // IDLE | UPLOADING | PROCESSING | COMPLETED | FAILED
  const [d3, setD3] = useState({ status:'IDLE', wanted:false, stage:'', modelUrl:null }); // IDLE | PROCESSING | COMPLETED | FAILED

  // Interactive Crop & Retouch state
  const [crop, setCrop] = useState({ rotation:0, zoom:1.0, ratio:'1:1', mood:'studio' });
  const [savedHdUrl, setSavedHdUrl] = useState(null);

  const camRef = useRef(null), galRef = useRef(null), extraRef = useRef(null);
  const set = (k, v) => setF(s => ({ ...s, [k]: v }));

  const onPickPhoto = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (f.photoPreview) URL.revokeObjectURL(f.photoPreview);
    setF(s => ({ ...s, photoFile:file, photoPreview:URL.createObjectURL(file) }));
    setEnhance({ status:'IDLE', steps:[], compare:50, source:'' });
    setCrop({ rotation:0, zoom:1.0, ratio:'1:1', mood:'studio' });
    setSavedHdUrl(null);
  };

  const onPickExtra = e => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const newExtras = files.map(file => ({ file, url: URL.createObjectURL(file) }));
    setF(s => ({ ...s, extraPhotos: [...s.extraPhotos, ...newExtras].slice(0, 4) }));
    toast(`Added ${files.length} extra angle for 3D reconstruction`, 'camera');
  };

  const askPrice = async () => {
    setAi(a => ({ ...a, priceLoading:true }));
    const r = await AI.suggestPrice({ material:f.material, hours:f.hours, cost:f.cost, craft:me.craft });
    setAi(a => ({ ...a, price:r, priceLoading:false }));
    if (!f.price) set('price', String(r.fair));
  };

  const runEnhance = async (targetMode = mode) => {
    setEnhance({ status:'UPLOADING', steps:[], compare:50, source:'' });
    await wait(300);
    setEnhance(s => ({ ...s, status:'PROCESSING' }));
    const res = await Api.enhanceImage(draftId, f.photoFile, targetMode, (stage) => {
      setEnhance(s => ({ ...s, currentStage: stage }));
    });
    setEnhance({
      status: res.status || 'COMPLETED',
      steps: res.steps || [],
      compare: 50,
      source: res.source,
      originalUrl: res.originalUrl,
      enhancedUrl: res.enhancedUrl,
      error: res.error
    });
    setSavedHdUrl(res.enhancedUrl);
    if (res.status === 'COMPLETED') toast('Professional studio photoshoot generated', 'sparkle');
  };

  const run3D = async () => {
    setD3({ wanted:true, status:'PROCESSING', stage:'Preparing images…' });
    try {
      const imageUrls = [
        savedHdUrl || enhance.enhancedUrl || f.photoPreview,
        ...f.extraPhotos.map(x => x.url)
      ].filter(Boolean);

      const craftType = f.cat || f.art || 'pot';
      await Api.generate3D(draftId, imageUrls, craftType);
      const final = await Api.poll3D(draftId, { demo: false, onUpdate: s => setD3(d => ({ ...d, stage: s.stage || '' })) });
      setD3({ wanted:true, status: final.status === 'COMPLETED' ? 'COMPLETED' : 'FAILED', stage:'', modelUrl: final.modelUrl || null });
      if (final.status === 'COMPLETED') toast('3D PBR Model generated & ready to inspect', 'cube');
    } catch (e) { setD3({ wanted:true, status:'FAILED', stage:'' }); }
  };

  useEffect(() => { if (step === 1 && enhance.status === 'IDLE' && f.photoFile) runEnhance(mode); }, [step]);
  useEffect(() => { if (step === 3 && !ai.price && !ai.priceLoading) askPrice(); }, [step]);

  const rotatePhoto = (delta) => {
    setCrop(c => ({ ...c, rotation: (c.rotation + delta + 360) % 360 }));
  };

  const downloadHd = () => {
    const url = savedHdUrl || enhance.enhancedUrl;
    if (!url) return;
    const a = document.createElement('a');
    a.href = url;
    a.download = `${f.name || 'enhanced_artisan_product'}.jpg`;
    a.click();
    toast('Downloaded HD product photo', 'check');
  };

  const publish = () => {
    const p = {
      id:'d' + Date.now(),
      name:f.name || 'Handmade Artisan Piece',
      cat:f.cat || 'pottery',
      art:f.art || 'pot',
      artisan:me.id,
      price:Number(f.price || 500),
      mrp:Math.round(Number(f.price || 500) * 1.3),
      rating:5,
      reviews:0,
      stock:Number(f.stock || 1),
      tag:'New',
      material:f.material || 'Handmade Traditional Materials',
      size:'Standard Artisan Dimensions',
      days:3,
      desc:f.desc || ('Handmade by ' + me.name + ' in ' + me.village + '.'),
      aiEnhanced: enhance.status === 'COMPLETED',
      originalPhotoUrl: enhance.originalUrl || f.photoPreview,
      enhancedPhotoUrl: savedHdUrl || enhance.enhancedUrl || null,
      threeDModelUrl: d3.status === 'COMPLETED' ? d3.modelUrl : null,
      has3D: d3.status === 'COMPLETED'
    };
    dispatch({ type:'publish', product:p });
    toast('Published! Your product is live on the marketplace', 'check');
    onDone(p);
  };

  const steps = [t('photo'), t('enhanceStep'), t('whatMaking'), t('priceStep'), t('threeDStep'), t('checkStep')];
  const canNext = [Boolean(f.art || f.photoFile), enhance.status === 'COMPLETED', f.name.trim().length > 2, Number(f.price) > 0, true, true][step];

  return (
    <div className="amode">
      <ABar title={t('addProduct')} onBack={step === 0 ? back : () => setStep(step - 1)} />
      <div className="awrap">
        <div className="steps">{steps.map((s, i) => <div key={i} className={'step' + (i < step ? ' on' : i === step ? ' cur' : '')} />)}</div>
        <p className="muted" style={{ marginBottom:8, fontSize:15 }}>Step {step + 1} of {steps.length}</p>
        <h2 style={{ marginBottom:18 }}>{steps[step]}</h2>

        {/* STEP 0: Upload Primary & Multi-Angle Photos */}
        {step === 0 && (
          <div className="bigcard stack" style={{ gap:18 }}>
            <input ref={camRef} type="file" accept="image/*" capture="environment" style={{ display:'none' }} onChange={onPickPhoto} />
            <input ref={galRef} type="file" accept="image/*" style={{ display:'none' }} onChange={onPickPhoto} />
            <input ref={extraRef} type="file" accept="image/*" multiple style={{ display:'none' }} onChange={onPickExtra} />

            <div className="photo-slot">
              {f.photoPreview ? (
                <img src={f.photoPreview} alt="Your product" style={{ width:'100%', height:'100%', objectFit:'contain' }} />
              ) : f.art ? (
                <CraftArt kind={f.art} variant="draft" />
              ) : (
                <div style={{ textAlign:'center', padding:24 }}>
                  <Ic n="camera" s={44} c="#6A7060" />
                  <p className="muted" style={{ marginTop:8, fontSize:15.5 }}>Take a photo of your product using your phone</p>
                  <span className="hint">Even photos with messy tables or shadows work — AI will handle the rest</span>
                </div>
              )}
            </div>

            <div className="row" style={{ gap:12, flexWrap:'wrap' }}>
              <button type="button" className="btn btn-pri btn-lg" style={{ flex:1 }} onClick={() => camRef.current?.click()}>
                <Ic n="camera" s={22} c="#fff" /> Take photo
              </button>
              <button type="button" className="btn btn-ghost btn-lg" style={{ flex:1 }} onClick={() => galRef.current?.click()}>
                Choose from gallery
              </button>
            </div>

            {f.photoPreview && (
              <div className="panel" style={{ background:'var(--surface-2)', padding:14 }}>
                <div className="between" style={{ marginBottom:8 }}>
                  <b><Ic n="cube" s={16} /> Optional: Multi-angle views (for higher precision 3D)</b>
                  <button type="button" className="btn btn-ghost" style={{ padding:'5px 12px', fontSize:13 }} onClick={() => extraRef.current?.click()}>
                    <Ic n="plus" s={14} /> Add angle (Back / Left / Right)
                  </button>
                </div>
                <div className="row" style={{ gap:10, flexWrap:'wrap' }}>
                  <div style={{ width:60, height:60, borderRadius:10, overflow:'hidden', border:'2px solid var(--green)', position:'relative' }}>
                    <img src={f.photoPreview} alt="Front" style={{ width:'100%', height:'100%', objectFit:'cover' }} />
                    <span style={{ position:'absolute', bottom:0, left:0, right:0, background:'rgba(0,0,0,0.6)', color:'#fff', fontSize:9, textAlign:'center' }}>Front</span>
                  </div>
                  {f.extraPhotos.map((ep, idx) => (
                    <div key={idx} style={{ width:60, height:60, borderRadius:10, overflow:'hidden', border:'1px solid var(--rule)', position:'relative' }}>
                      <img src={ep.url} alt={`Angle ${idx+1}`} style={{ width:'100%', height:'100%', objectFit:'cover' }} />
                      <span style={{ position:'absolute', bottom:0, left:0, right:0, background:'rgba(0,0,0,0.6)', color:'#fff', fontSize:9, textAlign:'center' }}>Angle {idx+2}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div id="cam">
              <p style={{ fontWeight:700, marginBottom:10 }}>Craft category</p>
              <div className="photo-pick">
                {ART_CHOICES.map(k => (
                  <button key={k} type="button" className="photo-opt" aria-pressed={f.art === k} onClick={() => set('art', k)} aria-label={k}>
                    <CraftArt kind={k} variant={k} />
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* STEP 1: AI Product Photoshoot Enhancement + Crop & Lighting Retouch */}
        {step === 1 && (
          <div className="bigcard stack" style={{ gap:18 }}>
            {(enhance.status === 'UPLOADING' || enhance.status === 'PROCESSING') && (
              <div className="stack" style={{ alignItems:'center', textAlign:'center', padding:'28px 0' }}>
                <div className="mini-spin" style={{ borderTopColor:'var(--marigold)', width:42, height:42, borderWidth:4 }} />
                <b style={{ fontSize:18, marginTop:8 }}>Generating professional e-commerce photoshoot…</b>
                <ul className="enh-list" style={{ marginTop:14 }}>
                  <li className="on">Analyzing product shape and isolating background</li>
                  <li className="on">Reconstructing studio softbox lighting and soft floor shadow</li>
                  <li className="on">Preserving fine craft texture, embroidery &amp; material fidelity</li>
                  <li className="on">Generating high-resolution {mode} composition</li>
                </ul>
              </div>
            )}

            {enhance.status === 'FAILED' && (
              <div className="empty" style={{ padding:'20px 0' }}>
                <Ic n="camera" s={32} c="#B4512A" />
                <h3>Could not complete enhancement reliably</h3>
                <p className="muted">{enhance.error || 'Please upload another photo with clearer lighting.'}</p>
                <button type="button" className="btn btn-green" onClick={() => runEnhance(mode)}>Try again</button>
              </div>
            )}

            {enhance.status === 'COMPLETED' && (
              <>
                <div className="field">
                  <label>Professional studio presentation style</label>
                  <div className="chipset">
                    {[
                      ['studio','Clean Studio (Softbox)'],
                      ['lifestyle','Lifestyle Interior'],
                      ['luxury','Luxury Product (Dark Graphite)'],
                      ['heritage','Traditional Heritage'],
                      ['marketplace','Clean Marketplace (Pure White)']
                    ].map(([v,l]) => (
                      <button key={v} type="button" className="chip" aria-pressed={mode === v}
                        onClick={() => { setMode(v); runEnhance(v); }}>
                        {l}
                      </button>
                    ))}
                  </div>
                  <span className="hint">Intelligently changes environment lighting and context while strictly preserving your authentic product.</span>
                </div>

                {/* Interactive Split-Screen Before / After Comparison */}
                <div className="field">
                  <div className="between" style={{ marginBottom:6 }}>
                    <label>Interactive Before / After Comparison</label>
                    <span className="muted" style={{ fontSize:13 }}>Drag slider horizontally</span>
                  </div>
                  <div className="compare" style={{ '--pos': enhance.compare + '%' }}>
                    <div className="compare-before">
                      <img src={enhance.originalUrl || f.photoPreview} alt="Original mobile photo" style={{ width:'100%', height:'100%', objectFit:'contain' }} />
                    </div>
                    <div className="compare-after" style={{ clipPath:`inset(0 0 0 ${enhance.compare}%)` }}>
                      <img src={savedHdUrl || enhance.enhancedUrl} alt="AI Enhanced"
                        style={{
                          width:'100%', height:'100%', objectFit:'contain',
                          transform: `rotate(${crop.rotation}deg) scale(${crop.zoom})`,
                          transition: 'transform 0.2s ease'
                        }} />
                    </div>
                    <span className="compare-tag left">Artisan raw mobile photo</span>
                    <span className="compare-tag right"><Ic n="sparkle" s={12} /> AI Enhanced Photoshoot</span>
                    <input type="range" min="0" max="100" value={enhance.compare}

                {/* Interactive Crop, Rotate & Lighting Toolbar */}

                  <div className="between" style={{ flexWrap:'wrap', gap:10, marginBottom:12 }}>
                    <b><Ic n="edit" s={16} /> Crop, Rotate &amp; Re-center Tool</b>
                    <div className="row" style={{ gap:8 }}>
                      <button type="button" className="btn btn-ghost" style={{ padding:'7px 12px', fontSize:13 }} onClick={() => rotatePhoto(-90)}>

                      </button>
                    </div>
                  </div>

                  <div className="row" style={{ gap:16, flexWrap:'wrap' }}>
                    <div className="field" style={{ flex:1, minWidth:180 }}>
                      <label style={{ fontSize:13 }}>Framing Zoom ({crop.zoom}x)</label>
                      <input type="range" min="0.8" max="1.3" step="0.05" value={crop.zoom}
                        onChange={e => setCrop(c => ({ ...c, zoom: Number(e.target.value) }))} />
                    </div>
                    <div className="field" style={{ flex:1, minWidth:180 }}>
                      <label style={{ fontSize:13 }}>Aspect Ratio</label>
                      <div className="chipset">
                        {['1:1 Square','4:5 Portrait','4:3 Studio'].map(r => (
                          <button key={r} type="button" className="chip" aria-pressed={crop.ratio === r}
                            onClick={() => setCrop(c => ({ ...c, ratio: r }))} style={{ padding:'5px 10px', fontSize:12.5 }}>
                            {r}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="ai-box">
                  <span className="ai-label"><Ic n="sparkle" s={15} /> Enhancement summary</span>
                  <ul className="enh-done">
                    {enhance.steps.map((s, i) => <li key={i}><Ic n="check" s={14} c="#2D6A4F" />{s}</li>)}
                  </ul>
                </div>
              </>
            )}
          </div>
        )}

        {/* STEP 2: Product Name & AI Structured Description */}

function InventoryView({ mine }) {
  const { dispatch, toast } = useStore();
  const [stock, setStock] = useState(() => Object.fromEntries(mine.map(p => [p.id, p.stock])));
  const bump = (id, d) => setStock(s => ({ ...s, [id]: Math.max(0, (s[id] ?? 0) + d) }));
  return (
    <>
      <h2 style={{ marginBottom:6 }}>Inventory</h2>
      <p className="muted" style={{ marginBottom:16 }}>Keep this up to date so buyers only order what you can actually make.</p>
      <div className="stack">
        {mine.map(p => { const n = stock[p.id] ?? p.stock; const low = n <= 3;
          return (
          <div className="bigcard" key={p.id} style={{ display:'flex', alignItems:'center', gap:16, padding:16, flexWrap:'wrap' }}>
            <div style={{ width:70, height:70, borderRadius:12, overflow:'hidden', border:'1px solid var(--rule)' }}><CraftArt kind={p.art} variant={p.id} /></div>
            <div style={{ flex:1, minWidth:160 }}>
              <b style={{ fontSize:16 }}>{p.name}</b>
              {low && <span className="tag low" style={{ position:'static', display:'inline-block', marginLeft:8 }}>Running low</span>}
            </div>
            <div className="qty" style={{ transform:'scale(1.15)' }}>
              <button onClick={() => bump(p.id, -1)} aria-label="Decrease stock">−</button>
              <span>{n}</span>
              <button onClick={() => bump(p.id, 1)} aria-label="Increase stock">+</button>
            </div>
            <button className="btn btn-green" onClick={() => toast('Stock updated to ' + n + ' pieces', 'check')}>Save</button>
          </div>); })}
      </div>
    </>
  );
}

    onDone={role => { setAuthTab(null); if (role === 'artisan') go({ page:'artisan' }); }} />;

  if (nav.page === 'artisan') return <>
    <ArtisanHome exit={() => go({ page:'home' })} go={go} onNeedAuth={() => setAuthTab('signup')} />
    {authModal}
  </>;

  const page = {
    home:     <Home go={go} />,
    list:     <Listing go={go} nav={nav} />,
    pdp:      <PDP go={go} nav={nav} />,
    maker:    <Maker go={go} nav={nav} />,
    cart:     <Cart go={go} />,
    wishlist: <Wishlist go={go} />,
    checkout: <Checkout go={go} />,
    orders:   <Orders go={go} />,
  }[nav.page] || <Home go={go} />;

  return (
    <>
      <Header go={go} nav={nav} query={query} onOpenDrawer={() => setDrawer(true)} onOpenAuth={t => setAuthTab(t)}
        onSearch={q => { setQuery(q); setNav(n => n.page === 'list' ? { ...n, q } : n); }} />
      <main className="wrap">
        <div className="shell">
          <Rail go={go} nav={nav} open={drawer} onClose={() => setDrawer(false)} />
          <div>{page}</div>
        </div>
      </main>
      <Footer go={go} />
      {authModal}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <StoreProvider><App /></StoreProvider>
);
</script>
<style>
/* late overrides that depend on component classnames */
@media (max-width:820px){
  .cart-grid{grid-template-columns:1fr !important}
  .prev-grid{grid-template-columns:1fr !important}
}
</style>
</body>
</html>
